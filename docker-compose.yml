services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - LLM_URL=http://host.docker.internal:11434
      - LLM_MODEL=hermes3:8b
      - LLM_API_KEY=ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api_data:/app/backend/data

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--http_port", "8222"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supply_chain
      POSTGRES_USER: scuser
      POSTGRES_PASSWORD: scpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  api_data:
