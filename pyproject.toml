[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-supply-chain"
version = "0.1.0"
description = "Multi-agent PoC for supply chain optimization"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "mlx-lm>=0.19",
    "httpx>=0.27",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "folium>=0.18",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["."]
